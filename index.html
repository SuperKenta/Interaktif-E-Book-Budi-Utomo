<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budi Utomo: Awal Kebangkitan Nasional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eee4cf;--card:#f8f2e5;--ink:#283b31;--mute:#6d6252;--rust:#a44834;--line:#b6a88d;--btn:#283b31;--btnt:#fff9e9;--ok:#2f7d5b;--bad:#a44834;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2119;--card:#262c22;--ink:#ece3cd;--mute:#b3a88f;--rust:#e08a6c;--line:#4e4d3c;--btn:#e6dcc0;--btnt:#1c2119}}
:root[data-theme="dark"]{--bg:#1c2119;--card:#262c22;--ink:#ece3cd;--mute:#b3a88f;--rust:#e08a6c;--line:#4e4d3c;--btn:#e6dcc0;--btnt:#1c2119}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:60px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.8 'Work Sans',system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Libre Baskerville',Georgia,serif;line-height:1.25;margin:0}
h1{font-size:clamp(32px,6vw,48px)}h2{font-size:24px;margin-bottom:16px}h3{font-size:19px;margin-bottom:8px}
p{margin:0 0 14px}
#pg{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:4px;background:var(--rust);width:0;z-index:9}
header{background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;font-size:14px}
a{color:var(--ink)}
.wrap{max-width:780px;margin:0 auto;padding:0 18px 40px}
.wide{max-width:1080px}
.paper{background:var(--card);border:1px solid var(--line);box-shadow:0 10px 35px rgba(47,38,25,.08);padding:clamp(22px,5vw,44px);margin-bottom:28px}
.ey{letter-spacing:.18em;font-size:12px;font-weight:700;color:var(--rust);margin-bottom:12px;text-transform:uppercase}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px;align-items:center;margin-top:28px}
.cover img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border:1px solid var(--rust);padding:6px;background:var(--bg)}
img{filter:sepia(.7) contrast(.92) saturate(.8)}
.sub{font-size:20px;font-family:'Libre Baskerville',serif}
.small{font-size:13px;color:var(--mute);line-height:1.6}
.btn{display:inline-block;border:1px solid var(--btn);background:var(--btn);color:var(--btnt);padding:10px 20px;font:600 14px 'Work Sans',sans-serif;cursor:pointer;text-decoration:none}
.btn.o{background:none;color:var(--ink)}
:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));column-gap:36px}
.toc a{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.txt p{padding:4px 12px;border-left:3px solid transparent;transition:background .3s}
.on{background:var(--bg);border-left-color:var(--rust)!important}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0}
.box{border:1px solid var(--line);padding:18px}
.gr.tight .box{padding:14px}
details{border-top:1px solid var(--line);padding:12px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;list-style:none;padding-right:24px;position:relative}
summary::-webkit-details-marker{display:none}
summary:after{content:'+';position:absolute;right:0;color:var(--rust);font-size:20px;line-height:1}
details[open] summary:after{content:'−'}
details p{color:var(--mute);margin:10px 0 0}
.tl{border-left:2px solid var(--rust);padding-left:22px;margin:8px 0 0 4px}
.flip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:22px;min-height:150px;text-align:center;font:600 15px/1.6 'Work Sans',sans-serif;cursor:pointer;display:grid;place-items:center}
.flip .b{display:none;font-weight:400}
.flip.on{background:var(--bg)}.flip.on .f{display:none}.flip.on .b{display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.gal button{display:block;width:100%;padding:0;border:1px solid var(--line);background:var(--bg);cursor:zoom-in}
.gal img{display:block;width:100%;height:210px;object-fit:cover}
figcaption{margin-top:10px}figure{margin:0}
.th{position:relative;margin-bottom:16px;background:var(--bg)}.th img{display:block;width:100%;height:190px;object-fit:cover}
.badge{position:absolute;left:10px;bottom:10px;background:var(--btn);color:var(--btnt);font-size:12px;padding:3px 10px}
.nv{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);margin-top:28px;padding-top:16px;font-size:14px}
.nv a{text-underline-offset:4px}.nv a:hover{color:var(--rust)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.big{font:700 48px 'Libre Baskerville',serif;color:var(--rust)}
textarea{width:100%;min-height:110px;padding:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:inherit;font-size:15px}
#lb{position:fixed;inset:0;background:rgba(15,20,16,.92);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;flex-direction:column}
#lb.show{display:flex}#lb img{max-width:100%;max-height:75vh;object-fit:contain}
#lb p{color:#f8f2e5;font-size:14px;text-align:center;margin-top:12px}
footer{text-align:center;border-top:1px solid var(--line);padding:26px;font-size:14px}
video{display:block;width:100%;background:#000;margin-bottom:16px}
</style>
</head>

var CH=[
{s:'Makna Kebangkitan Nasional',k:'Pengantar',t:'Apa makna Kebangkitan Nasional?',p:['Pada awal abad ke-20, Hindia Belanda berada di bawah pemerintahan kolonial. Akses pendidikan bagi penduduk bumiputra masih terbatas. Namun, lingkungan sekolah juga mempertemukan pelajar dengan gagasan tentang kemajuan dan kerja bersama. Di tengah keadaan inilah organisasi modern mulai tumbuh.']},
{s:'Hindia Belanda dan pendidikan',k:'Latar sosial',t:'Pendidikan dalam masyarakat kolonial',p:['Kesempatan belajar tidak tersebar merata dan pengalaman setiap kelompok masyarakat berbeda. Karena itu, kemunculan pelajar terdidik perlu dilihat bersama keterbatasan yang dialami banyak penduduk, bukan sebagai gambaran keadaan seluruh masyarakat.'],more:['Baca selengkapnya · Mengapa konteks penting?','Pendidikan membuka ruang bagi sebagian orang untuk bertemu dan bertukar gagasan. Pada saat yang sama, sekolah kolonial tidak menghapus ketimpangan sosial. Kedua kenyataan itu membantu kita membaca kemunculan organisasi secara lebih hati-hati.']},
{s:'STOVIA dan para pelajar',k:'Ruang belajar',t:'STOVIA dan para pelajar kedokteran',p:['STOVIA adalah sekolah pendidikan dokter bumiputra di Batavia. Para pelajarnya tidak hanya mempelajari ilmu kedokteran; sebagian juga berdiskusi tentang cara meningkatkan kehidupan masyarakat. Gagasan dr. Wahidin Sudirohusodo mengenai pentingnya pendidikan memberi dorongan kepada para pelajar, termasuk Soetomo.','Kehidupan belajar menyediakan tempat untuk percakapan antarpelajar. Foto bangunan dalam galeri buku ini tidak dimaksudkan sebagai foto STOVIA.'],more:['Kartu fakta · Apa itu STOVIA?','STOVIA merupakan singkatan dari School tot Opleiding van Indische Artsen, lembaga pendidikan kedokteran di Batavia pada masa kolonial.']},
{s:'Tokoh dan peran',k:'Pelaku sejarah',t:'Tokoh dan peran yang tercatat',p:['Pendirian organisasi ini melibatkan banyak pelajar. Dua profil singkat berikut tidak mewakili seluruh orang yang berperan.'],grid:[['Soetomo','Pelajar STOVIA yang dikenal sebagai salah satu tokoh utama pendirian Budi Utomo bersama rekan-rekannya.'],['Wahidin Sudirohusodo','Dokter yang gagasannya tentang perluasan pendidikan memberi dorongan kepada para pelajar STOVIA.']]},
{s:'Kenali konteksnya',k:'Kartu interaktif',t:'Kenali konteksnya',p:['Buka setiap kartu untuk melihat penjelasan singkat.'],acc:[['Mengapa tanggal 20 Mei dikenang?','Tanggal 20 Mei kemudian diperingati sebagai Hari Kebangkitan Nasional. Peringatan ini menempatkan berdirinya Budi Utomo sebagai penanda penting, bukan sebagai satu-satunya awal seluruh perjuangan bangsa.'],['Apakah semua penduduk dapat bersekolah?','Tidak. Akses pendidikan pada masa kolonial terbatas dan tidak merata.'],['Apakah foto ilustratif adalah arsip peristiwa?','Tidak. Foto modern di ebook ini membantu membangun suasana membaca, tetapi tidak membuktikan rupa orang, gedung, atau pertemuan tahun 1908.']]},
{s:'Pertemuan dan gagasan',k:'Pertemuan gagasan',t:'Dari percakapan menuju prakarsa',p:['Pertemuan Wahidin Sudirohusodo dengan pelajar STOVIA membawa perhatian pada pendidikan dan kemajuan masyarakat. Para pelajar kemudian mengembangkan prakarsa untuk bekerja bersama melalui sebuah organisasi. Proses ini lebih tepat dipahami sebagai pertemuan gagasan dan tindakan kolektif daripada karya seorang tokoh saja.'],more:['Baca selengkapnya · Gagasan pendidikan','Perhatian terhadap kesempatan belajar menjadi salah satu titik temu. Organisasi memberi cara untuk membahas tujuan bersama secara lebih teratur, meskipun pandangan para anggotanya tidak harus selalu sama.']},
{s:'20 Mei 1908',k:'20 Mei 1908',t:'Sebuah organisasi lahir di Batavia',p:['Pada 20 Mei 1908, para pelajar STOVIA mendirikan Budi Utomo di Batavia. Soetomo dikenal sebagai tokoh penting dalam pendiriannya. Perhatian awal organisasi ini berkaitan dengan pendidikan dan kemajuan masyarakat. Budi Utomo menjadi salah satu tonggak berkembangnya bentuk perjuangan melalui organisasi.'],more:['Kartu fakta · Mengapa tanggalnya dikenang?','Tanggal 20 Mei kemudian diperingati sebagai Hari Kebangkitan Nasional, peringatan pertamanya pada 1948. Tanggal ini menempatkan berdirinya Budi Utomo sebagai penanda penting, bukan satu-satunya awal seluruh perjuangan bangsa.']},
{s:'Linimasa',k:'Kronologi',t:'Linimasa peristiwa',p:['Buka setiap catatan untuk membaca konteksnya. Penanda tanpa tanggal pasti sengaja tidak diberi tanggal baru.'],tl:[['Awal 1900-an · Pendidikan dan gagasan kemajuan','Di tengah keterbatasan pendidikan kolonial, gagasan memperluas kesempatan belajar bagi bumiputra mendapat perhatian.'],['Menjelang pendirian · Wahidin bertemu pelajar STOVIA','Gagasan Wahidin mengenai pendidikan ikut mendorong percakapan dan prakarsa para pelajar.'],['20 Mei 1908 · Budi Utomo berdiri','Para pelajar STOVIA mendirikan Budi Utomo di Batavia, dengan Soetomo sebagai salah satu tokoh utamanya.'],['Oktober 1908 · Kongres pertama','Kongres pertama di Yogyakarta menjadi ruang membicarakan tujuan serta cara kerja organisasi.'],['1935 · Melebur ke Parindra','Budi Utomo bergabung dengan organisasi lain membentuk Partai Indonesia Raya (Parindra).']]},
{s:'Sebelum dan sesudah',k:'Membaca perubahan',t:'Sebelum dan sesudah: bukan garis pemisah mutlak',p:['Perbandingan ini menjelaskan perubahan bentuk, bukan menyatakan bahwa semua gerakan kemudian sama atau bahwa bentuk sebelumnya lenyap.'],grid:[['Sebelum organisasi ini','Upaya memperbaiki kehidupan masyarakat dan menentang ketidakadilan telah memiliki beragam bentuk. Sejarahnya tidak dimulai dari keadaan tanpa tindakan bersama.'],['Ketika organisasi modern tumbuh','Perkumpulan dengan anggota, pembahasan tujuan, dan kegiatan bersama menjadi semakin terlihat sebagai salah satu cara bergerak.']]},
{s:'Perkembangan arah',k:'Perjalanan organisasi',t:'Arah yang berkembang dari waktu ke waktu',p:['Perhatian awal Budi Utomo berkaitan dengan pendidikan dan kemajuan masyarakat. Seiring perjalanan organisasi, pembahasan mengenai arah, keanggotaan, serta cara mencapai tujuan berkembang. Karena itu, organisasi ini tidak perlu digambarkan seolah memiliki fokus yang sepenuhnya tetap sepanjang sejarahnya.'],more:['Baca selengkapnya · Menghindari penyederhanaan','Sejarah organisasi juga melibatkan perbedaan pandangan dan perubahan keadaan. Membaca perkembangan tersebut membantu membedakan cita-cita awal dari seluruh perjalanan organisasi setelahnya.']},
{s:'Pendidikan dan organisasi',k:'Jejak dan dampak',t:'Pendidikan dan kesadaran berorganisasi',p:['Pentingnya Budi Utomo terletak pada langkah bersama yang terorganisasi untuk membicarakan kemajuan masyarakat. Pergerakan nasional selanjutnya berkembang melalui banyak organisasi dan tokoh dengan tujuan serta cara yang beragam. Karena itu, kisah Budi Utomo paling tepat dibaca sebagai salah satu bagian dari proses sejarah yang lebih luas.','Pendidikan dalam kisah ini bukan sekadar tempat memperoleh pelajaran. Bagi sebagian pelajar, pengalaman bertemu dan berdiskusi juga membuka peluang untuk merumuskan kerja bersama.']},
{s:'Mitos dan fakta',k:'Uji pemahaman',t:'Mitos dan fakta',p:['Tekan kartu untuk membaliknya; tekan lagi untuk kembali.'],flip:[['Mitos: Kebangkitan Nasional bermula dari satu peristiwa saja.','Fakta: 20 Mei 1908 adalah penanda penting dalam proses sejarah yang lebih luas.'],['Mitos: Wahidin dan Soetomo memiliki peran yang persis sama.','Fakta: Wahidin memberi dorongan gagasan pendidikan; Soetomo termasuk pelajar penggerak pendirian.'],['Mitos: Foto bernuansa lama pasti merupakan arsip tahun 1908.','Fakta: Tampilan sepia tidak membuktikan asal foto. Gambar di sini dilabeli sebagai ilustrasi modern.']]},
{s:'Galeri visual',k:'Arsip visual ilustratif',t:'Galeri visual',gal:1},
{s:'Video dan audio',k:'Visual dan suara',t:'Ruang media',media:1},
{s:'Relevansi masa kini',k:'Ruang refleksi',t:'Apa yang masih relevan hari ini?',p:['Kisah ini memberi ruang untuk memikirkan nilai belajar, berbagi pengetahuan, dan menyusun kerja bersama. Relevansinya bukan berarti keadaan sekarang sama dengan masa kolonial; yang dapat dipelajari adalah pentingnya memahami masalah, mendengarkan orang lain, dan bekerja dengan tujuan yang jelas.']},
{s:'Ringkasan inti',k:'Catatan pembaca',t:'Empat hal untuk diingat',grid:[['','Pendidikan bagi bumiputra pada masa kolonial terbatas dan tidak merata.'],['','STOVIA menjadi salah satu ruang pertemuan pelajar dan gagasan.'],['','Budi Utomo didirikan pelajar STOVIA pada 20 Mei 1908.'],['','Pergerakan nasional merupakan proses luas yang melibatkan banyak pihak.']],tight:1},
{s:'Kuis akhir',k:'Periksa pemahaman',t:'Kuis akhir · 8 pertanyaan',quiz:1},
